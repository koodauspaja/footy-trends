services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      # From the environment, not written here. A password in a tracked file is
      # a credential in git history whatever it protects, and Sonar counts it as
      # one (#292). Compose reads `.env` from the repository root, so
      # `POSTGRES_PASSWORD=postgres` there restores the old behaviour; `:?`
      # makes an unset value a clear error rather than a container that starts
      # with no password at all.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: footy-trends
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data-v18:
  redis-data:
