# Why each setting is as it is: decisions/531-configuration-files.md
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      # From the environment, not written here; `:?` makes an unset value a
      # clear error. The name is project-scoped, because a shell export beats
      # `.env`.
      POSTGRES_PASSWORD: ${FOOTY_POSTGRES_PASSWORD:?set FOOTY_POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: footy-trends
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-v18:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data-v18:
  redis-data:
