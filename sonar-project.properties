sonar.projectKey=koodauspaja_footy-trends
sonar.organization=koodauspaja

sonar.sources=src
#sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Exclude generated files and config from analysis
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.coverage.exclusions=**/*.spec.ts,src/instrumentation.ts,src/instrumentation-client.ts,src/app/global-error.tsx,src/db/index.ts,src/db/migrate.ts,src/lib/redis.ts,src/app/sentry-example-page/page.tsx,src/app/api/sentry-example-api/route.ts

# src/lib/competitions.ts is a static data table (9 competitions, each a
# {code, name, flagUrl, country} object literal) — the repeated shape is
# necessary, readable data, not copy-pasted logic. Excluded from duplication
# analysis rather than contorted into something templated just to dodge the
# metric.
sonar.cpd.exclusions=src/lib/competitions.ts