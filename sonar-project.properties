sonar.projectKey=koodauspaja_footy-trends
sonar.organization=koodauspaja

sonar.sources=src
#sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Without this, the scanner uploads analysis and exits successfully as soon
# as the scan itself completes — the Quality Gate is evaluated afterward,
# asynchronously, on SonarCloud's servers, and its pass/fail never reaches
# the CI job. This makes the scanner poll for the gate result and fail the
# job (and therefore the "SonarCloud scan" GitHub check) when it does.
sonar.qualitygate.wait=true

# Exclude generated files and config from analysis
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**
sonar.coverage.exclusions=**/*.spec.ts,src/instrumentation.ts,src/instrumentation-client.ts,src/app/global-error.tsx,src/db/index.ts,src/db/migrate.ts,src/lib/redis.ts,src/app/sentry-example-page/page.tsx,src/app/api/sentry-example-api/route.ts