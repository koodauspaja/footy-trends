# Why each setting is as it is: decisions/531-configuration-files.md
sonar.projectKey=koodauspaja_footy-trends
sonar.organization=koodauspaja

# Everything, not just `src`.
sonar.sources=.
# Stated rather than inherited from whatever charset the runner defaults to.
sonar.sourceEncoding=UTF-8

# Tests are declared rather than excluded, so Sonar applies its test-specific
# rules to them while keeping them out of coverage and duplication, which are
# measured on main sources only.
sonar.tests=tests

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# No `sonar.typescript.tsconfigPath` on purpose: the analyzer finds
# tsconfig.json from the project root by itself.

# Without this the scanner exits successfully before the Quality Gate is
# evaluated, so the gate's pass or fail never reaches the check.
sonar.qualitygate.wait=true

# Build output, dependencies, generated reports and the migration snapshots
# Drizzle writes.
sonar.exclusions=**/*.ico,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,tests/**,package-lock.json,node_modules/**,.next/**,out/**,coverage/**,playwright-report/**,test-results/**,drizzle/migrations/meta/**,next-env.d.ts

# Files a unit test cannot usefully cover, in three groups. The counts are
# read by tests/unit/scripts/coverage-exclusions.test.ts, which fails when a
# group changes without its count.
#   exclusion-count: total 27
#   exclusion-count: connects-at-import 2
#   exclusion-count: tested-runner-half 17
#   exclusion-count: tooling-configuration 8
sonar.coverage.exclusions=src/db/migrate.ts,src/lib/redis.ts,scripts/backfill.ts,scripts/backfill-run.ts,scripts/predictions.ts,scripts/e2e-freshness.ts,scripts/coverage-gaps.ts,scripts/generate-migration.ts,scripts/release-version.ts,scripts/release-pr.ts,scripts/grant-admin.ts,scripts/grant-admin-run.ts,scripts/verify-sentry.ts,scripts/review-findings.ts,scripts/with-test-db.ts,scripts/services-run.ts,scripts/ensure-services.ts,scripts/db-reset.ts,scripts/railway-environment.ts,drizzle.config.ts,next.config.ts,playwright.config.ts,postcss.config.mjs,sentry.edge.config.ts,sentry.server.config.ts,vitest.config.ts,vitest.setup.ts

# Both files are static data tables whose repeated shape is necessary, readable
# data rather than copy-pasted logic.
sonar.test.exclusions=**/*.ico,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif

sonar.plsql.file.suffixes=pks,pkb

sonar.cpd.exclusions=src/lib/competitions.ts,src/lib/domestic-competitions.ts,.github/workflows/**,drizzle/migrations/**
# An `await` in a loop that must run in order is not a defect: a provider with
# a rate limit, a retry, a poll until a deadline. Closed for that one rule in
# the files named and nowhere else, and no other rule is ignored anywhere.
# The reason per file: decisions/592-sonar-zero-open-issues-again.md
sonar.issue.ignore.multicriteria.loops1.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loops1.resourceKey=scripts/backfill-run.ts
sonar.issue.ignore.multicriteria.loops2.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loops2.resourceKey=scripts/review-findings.ts
sonar.issue.ignore.multicriteria.loops3.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loops3.resourceKey=scripts/services-plan.ts
sonar.issue.ignore.multicriteria.loops4.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loops4.resourceKey=src/lib/provider-request.ts
sonar.issue.ignore.multicriteria.loops5.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.loops5.resourceKey=scripts/issue-boxes-steps.ts
sonar.issue.ignore.multicriteria=loops1,loops2,loops3,loops4,loops5
