# Why each setting is as it is: decisions/531-configuration-files.md
# The TASO key and the salt that signs each request are read from Palloliitto's
# public frontend, not issued to us, so either can stop working without notice.
# This checks them on a schedule.
name: TASO key check

on:
  schedule:
    # 06:00 UTC daily. Early enough that a broken key is known before the day's
    # fixtures matter, and daily because there is no evidence yet on how often
    # the key actually rotates.
    - cron: "0 6 * * *"
  workflow_dispatch:

# The token every job gets unless it asks for more.
permissions:
  contents: read

concurrency:
  group: taso-key-check
  cancel-in-progress: false

jobs:
  check:
    name: Production can still reach TASO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask production whether its TASO key still works
        env:
          HEALTH_URL: https://footy-trends.up.railway.app/api/health?providers=1
          # Production's own copy is the web service's variable of the same
          # name. Without the token the endpoint never calls TASO.
          HEALTH_PROVIDERS_TOKEN: ${{ secrets.HEALTH_PROVIDERS_TOKEN }}
        run: |
          set -euo pipefail

          # `--fail-with-body` so a non-2xx still prints what came back: the
          # body is where the reason is, and a bare exit code sends whoever
          # reads this to reproduce it by hand. The token goes in through
          # stdin, never on the command line.
          if ! body=$(printf 'x-health-providers-token: %s\n' "$HEALTH_PROVIDERS_TOKEN" \
            | curl -sS --fail-with-body --max-time 30 -H @- "$HEALTH_URL"); then
            echo "The health endpoint itself did not answer:"
            echo "$body"
            exit 1
          fi

          echo "$body" | jq .

          taso=$(echo "$body" | jq -r '.checks.taso // "absent"')
          if [ "$taso" = "absent" ]; then
            echo
            echo "::error::Production made no TASO check: it did not accept the token."
            echo "The secret HEALTH_PROVIDERS_TOKEN and the web service's variable of"
            echo "the same name must hold one value (docs/setup/018-health-check.md)."
            exit 1
          fi
          if [ "$taso" != "ok" ]; then
            echo
            echo "::error::TASO check reported '$taso'."
            echo "Production's TASO key, or its signing salt TASO_HASH_SALT, may have stopped working:"
            echo "a missing, stale or rotated salt is refused the same way as a stale key."
            echo "See docs/setup/020-taso-api-key.md, 'Re-scraping when the key stops working'."
            echo
            echo "A 403 from Cloudflare is the usual sign of a stale key, but it can also"
            echo "be their WAF blocking for another reason — check the body above before"
            echo "assuming a re-scrape is the fix (#113)."
            exit 1
          fi

          echo "TASO reachable with production's key."
