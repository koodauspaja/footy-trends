name: CI

on:
  push:
    branches:
      - main
  # Scoped to main deliberately. Without a branch filter this also runs on pull
  # requests targeting `release`, re-checking commits already reviewed on their
  # way into main. release.yml covers those, and adds e2e. See #85.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  # Deliberately has no service containers. A unit test that reaches Postgres
  # or Redis must fail here, where the job name says what broke — not only in
  # the SonarCloud workflow, which has no services either and reports the same
  # failure as "SonarCloud scan failed". See issue #158.
  unit:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        # `--ignore-scripts` blocks dependency lifecycle scripts, which are how a
        # compromised package runs code on a runner holding our tokens
        # (githubactions:S6505). Nothing here needs them: the only script in
        # package.json is husky, which installs git hooks no CI job uses, and
        # the two dependencies that fetch binaries — esbuild and @sentry/cli —
        # resolve them from optional platform packages instead. Verified in #258
        # by installing this way and running typecheck, lint, the full unit
        # suite and a production build.
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration
