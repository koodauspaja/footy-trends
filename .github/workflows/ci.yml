# Why each setting is as it is: decisions/531-configuration-files.md
name: CI

on:
  push:
    branches:
      - main
  # Scoped to main deliberately. Without a branch filter this also runs on pull
  # requests targeting `release`, re-checking commits already reviewed on their
  # way into main. release.yml covers those, and adds e2e.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# The token every job gets unless it asks for more.
permissions:
  contents: read

# A pull request's newer run supersedes its older one. A push to `main` gets a
# group of its own per commit, so it is never cancelled and never evicted from a
# queue: the same shape, for the same reason, as release.yml.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Deliberately has no service containers.
  unit:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        # `--ignore-scripts` blocks dependency lifecycle scripts, which are how
        # a compromised package runs code on a runner holding our tokens
        # (githubactions:S6505).
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Runs the same suite in a random order, which is the only way to catch a
      # test that passes because its neighbour ran first.
      - name: Unit tests, shuffled
        run: npm run test:shuffle

  # The build Railway runs, with the Axiom variables set so the logger creates
  # its transport: decisions/574-pino-transport-target.md. Every value is a
  # placeholder, and nothing here connects to a database, Redis or a provider.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/none
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      FOOTBALL_DATA_API_KEY: ci-dummy
      TASO_API_KEY: ci-dummy
      AXIOM_TOKEN: ci-placeholder
      AXIOM_DATASET: ci-placeholder

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          # Made for this run and gone with it: the run's own id, so no
          # workflow holds a password.
          POSTGRES_PASSWORD: ${{ github.run_id }}
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ github.run_id }}@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379
      # Dummy literals, not secrets.
      BETTER_AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

  # Fails when a checkbox on an issue this pull request closes is neither ticked
  # nor explained.
  boxes:
    name: Issue checkboxes
    if: |
      github.event_name == 'pull_request' && (
        github.actor == vars.OWNER_USERNAME ||
        github.actor == vars.COLLABORATOR_USERNAME ||
        github.actor == 'renovate[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Issue checkboxes
        run: npm run check:boxes -- ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
