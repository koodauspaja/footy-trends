# Runs the full suite against the release branch, which is what production
# deploys from. Separate from ci.yml deliberately: this is the only place e2e
# runs (see #81), and static analysis is *not* repeated here because a release
# PR carries commits already reviewed on their way into main.
#
# The `push` trigger is not optional. Railway only offers its "Wait for CI"
# setting when a workflow has a push trigger for the tracked branch, and that
# setting is what stops a deploy whose tests failed. `pull_request` alone would
# gate the merge but leave the deploy ungated.
#
# `workflow_dispatch` exists so this can be exercised without cutting a
# release — the first real release should not be the first time it runs.
#
# Deliberately *without* ci.yml's `github.actor` guard. GitHub counts a skipped
# required check as satisfied, so a guard that skips would let a release PR
# merge with no tests run at all — the one hole this gate cannot have. A fork
# pull request receives no secrets, so the e2e job fails rather than leaking
# them, and failing is the correct outcome for an untrusted release PR.
name: Release

on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened]
  push:
    branches:
      - release
  workflow_dispatch:

# Concurrency here protects the *gate*, not the provider — those turn out to be
# incompatible goals with this mechanism, and the gate wins.
#
# GitHub keeps one running and one pending run per group, and a newly queued run
# evicts the pending one even with `cancel-in-progress: false`. So any group two
# runs can share is a group in which a push run's status can be silently
# dropped, and that status is what Railway's Wait for CI is waiting on. Push
# runs therefore get a group per commit: never queued behind anything, never
# evicted, never cancelled.
#
# That means overlapping live-provider load is possible, and this workflow does
# not pretend otherwise. If football-data.org's rate limit starts producing
# false failures, the fix is a CI-only provider key rather than a shared
# concurrency group — a rate-limited run fails safe by blocking a deploy, while
# an evicted push run removes the gate entirely.
#
# Pull-request runs supersede their own predecessors, which is only ever useful.
concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Release — typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Release — integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Release — end-to-end tests
    runs-on: ubuntu-latest
    # Longer than the other jobs by design: 105 specs run serially against live
    # providers. The default 360 minutes would let a stall burn an hour before
    # anyone noticed.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379
      # tests/e2e/global-setup.ts fails fast without these rather than letting
      # every spec time out against a generic error page.
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      TASO_API_KEY: ${{ secrets.TASO_API_KEY }}
      # Literals rather than `vars.*`: an undefined repository variable expands
      # to an empty string, both of these fall back to a default when unparseable,
      # and the suite would then run against a season floor nobody chose. These
      # match .env.example.
      FOOTBALL_DATA_EARLIEST_SEASON: "2023"
      FOOTBALL_DATA_REFRESH_INTERVAL_SECONDS: "3600"
      # Switches playwright.config.ts's webServer from `next dev` to `npm start`.
      E2E_TARGET: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      # Chromium only, per #81. `--with-deps` because the runner has none of
      # the shared libraries a headless browser needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npm run db:migrate

      # Built here rather than by Playwright's webServer: a release gate should
      # exercise what ships, and `webServer` runs a single command with a
      # start-up timeout that a full build would blow through.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only after every gate is green, and only on the merge itself — never on a
  # pull request. A tag is effectively permanent and public, so it must not be
  # possible to create one for a release that was rejected or that failed its
  # tests.
  tag:
    name: Release — tag and publish
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the commits since the last tag, so a
          # shallow clone without tags would compute the wrong one.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Work out the version
        id: version
        env:
          # Names the first release. Set it as a repository variable before that
          # release; there is no need to unset it afterwards, because two things
          # keep it from touching a later one:
          #
          #   - once a release is tagged, the next promotion finds that tag and
          #     derives from it, so the override is never consulted
          #   - a rerun takes the version off the tag already on HEAD, before
          #     the override is read at all
          #
          # Not "inert once any tag exists", which is what this said before and
          # is stronger than the code gives: a repository whose *only* tags were
          # pre-release or malformed would have no previous tag either. That is
          # a named limitation on `firstReleaseVersion` in scripts/next-version.ts
          # rather than an oversight — guarding it needs a second definition of
          # "has this been tagged", and having two produced six rounds of
          # contradictions before they were reduced back to one.
          FIRST_RELEASE_VERSION: ${{ vars.FIRST_RELEASE_VERSION }}
        run: |
          version="$(npm run release:version --silent -- --since-last-tag --print=version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run release:version --silent -- --since-last-tag --print=notes > /tmp/release-notes.md
          echo "Version: $version"

      # Checked independently: if the tag push succeeded once but publishing
      # the notes did not, a rerun must still be able to publish them rather
      # than skip both and leave a tagged commit with no release.
      - name: What already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            # An existing tag is only acceptable if it names *this* commit —
            # a rerun. Pointing anywhere else means the version was already
            # used for something else, and publishing notes against it would
            # break the one guarantee the tag carries: that it identifies the
            # commit the tests ran on.
            tagged="$(git rev-list -n 1 "refs/tags/$version")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$version already exists and points at $tagged, not $GITHUB_SHA."
              echo "::error::Refusing to publish a release whose tag names a different commit."
              exit 1
            fi
            echo "tag=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $version already points at this commit — rerun."
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $version already published."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the merge commit
        if: steps.exists.outputs.tag == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so the tag records who cut the release and when.
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish the release notes
        if: steps.exists.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
