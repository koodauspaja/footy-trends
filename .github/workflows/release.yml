# Runs the full suite against the release branch, which is what production
# deploys from. Separate from ci.yml deliberately: this is the only place e2e
# runs (see #81), and static analysis is *not* repeated here because a release
# PR carries commits already reviewed on their way into main.
#
# The `push` trigger is not optional. Railway only offers its "Wait for CI"
# setting when a workflow has a push trigger for the tracked branch, and that
# setting is what stops a deploy whose tests failed. `pull_request` alone would
# gate the merge but leave the deploy ungated.
#
# `workflow_dispatch` exists so this can be exercised without cutting a
# release — the first real release should not be the first time it runs.
#
# Deliberately *without* ci.yml's `github.actor` guard. GitHub counts a skipped
# required check as satisfied, so a guard that skips would let a release PR
# merge with no tests run at all — the one hole this gate cannot have. A fork
# pull request receives no secrets, so the e2e job fails rather than leaking
# them, and failing is the correct outcome for an untrusted release PR.
name: Release

on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened]
  push:
    branches:
      - release
  workflow_dispatch:

# One release suite at a time, across every trigger. The e2e job runs against
# the live football-data.org API, and two overlapping runs exhaust its rate
# limit between them — which surfaces as a failed gate that nothing in the code
# caused.
#
# Queued rather than cancelling: these runs share one group, and
# `cancel-in-progress` cancels *others* in the group, so a pull-request run
# updated mid-flight would be free to cancel the post-merge push run — the one
# Railway's Wait for CI is waiting on. A superseded pull-request run finishing
# first costs a few minutes; a cancelled push run costs the deploy gate.
concurrency:
  group: release-suite
  cancel-in-progress: false

jobs:
  unit:
    name: Release — typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Release — integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Release — end-to-end tests
    runs-on: ubuntu-latest
    # Longer than the other jobs by design: 86 specs run serially against live
    # providers. The default 360 minutes would let a rate-limit stall burn an
    # hour before anyone noticed.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379
      # tests/e2e/global-setup.ts fails fast without these rather than letting
      # every spec time out against a generic error page.
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      TASO_API_KEY: ${{ secrets.TASO_API_KEY }}
      # Literals rather than `vars.*`: an undefined repository variable expands
      # to an empty string, both of these fall back to a default when unparseable,
      # and the suite would then run against a season floor nobody chose. These
      # match .env.example.
      FOOTBALL_DATA_EARLIEST_SEASON: "2023"
      FOOTBALL_DATA_REFRESH_INTERVAL_SECONDS: "3600"
      # Switches playwright.config.ts's webServer from `next dev` to `npm start`.
      E2E_TARGET: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      # Chromium only, per #81. `--with-deps` because the runner has none of
      # the shared libraries a headless browser needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npm run db:migrate

      # Built here rather than by Playwright's webServer: a release gate should
      # exercise what ships, and `webServer` runs a single command with a
      # start-up timeout that a full build would blow through.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only after every gate is green, and only on the merge itself — never on a
  # pull request. A tag is effectively permanent and public, so it must not be
  # possible to create one for a release that was rejected or that failed its
  # tests.
  tag:
    name: Release — tag and publish
    runs-on: ubuntu-latest
    needs: [unit, integration, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the commits since the last tag, so a
          # shallow clone without tags would compute the wrong one.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Work out the version
        id: version
        run: |
          version="$(npm run release:version --silent -- --since-last-tag --print=version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run release:version --silent -- --since-last-tag --print=notes > /tmp/release-notes.md
          echo "Version: $version"

      - name: Skip if it is already tagged
        id: exists
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.version }} already exists — nothing to tag."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the merge commit
        if: steps.exists.outputs.already == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so the tag records who cut the release and when.
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish the release notes
        if: steps.exists.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
