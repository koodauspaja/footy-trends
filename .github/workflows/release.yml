# Why each setting is as it is: decisions/531-configuration-files.md
# Runs the full suite against the release branch, which production deploys
# from. The `push` trigger is what lets Railway wait for CI before a deploy, and
# there is no `github.actor` guard: a skipped required check counts as passed.
name: Release

on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened]
  push:
    branches:
      - release
  workflow_dispatch:

# The token every job gets unless it asks for more.
permissions:
  contents: read

# Concurrency here protects the *gate*, not the provider — those turn out to be
# incompatible goals with this mechanism, and the gate wins.
concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Release — typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        # `--ignore-scripts` blocks dependency lifecycle scripts, which are how
        # a compromised package runs code on a runner holding our tokens
        # (githubactions:S6505).
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Release — integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379
      # Dummy literals, not secrets.
      BETTER_AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Release — end-to-end tests
    runs-on: ubuntu-latest
    # Longer than the other jobs by design: 105 specs run serially against live
    # providers. The default 360 minutes would let a stall burn an hour before
    # anyone noticed.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: footy-trends
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/footy-trends
      REDIS_URL: redis://localhost:6379
      # Dummy literals, not secrets.
      BETTER_AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret
      # tests/e2e/global-setup.ts fails fast without these rather than letting
      # every spec time out against a generic error page.
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      TASO_API_KEY: ${{ secrets.TASO_API_KEY }}
      # Literals, not `vars.*`: an undefined variable expands to an empty string,
      # and the suite would then run against a season floor nobody chose.
      FOOTBALL_DATA_EARLIEST_SEASON: "2023"
      FOOTBALL_DATA_REFRESH_INTERVAL_SECONDS: "3600"
      # Switches playwright.config.ts's webServer from `next dev` to `npm start`.
      E2E_TARGET: build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Chromium only, through an npm script and not `npx`, which may fetch a
      # package on demand and run its lifecycle scripts.
      - name: Install Chromium for Playwright
        run: npm run test:e2e:browser

      - name: Run database migrations
        run: npm run db:migrate

      # Built here rather than by Playwright's webServer: a release gate should
      # exercise what ships, and `webServer` runs a single command with a
      # start-up timeout that a full build would blow through.
      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Only after every gate is green, and only on the merge itself — never on a
  # pull request.
  tag:
    name: Release — tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit, integration, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from the commits since the last tag, so a
          # shallow clone without tags would compute the wrong one.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Work out the version
        id: version
        env:
          # Names the first release.
          FIRST_RELEASE_VERSION: ${{ vars.FIRST_RELEASE_VERSION }}
        run: |
          version="$(npm run release:version --silent -- --since-last-tag --print=version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm run release:version --silent -- --since-last-tag --print=notes > /tmp/release-notes.md
          echo "Version: $version"

      # Checked independently: if the tag push succeeded once but publishing
      # the notes did not, a rerun must still be able to publish them rather
      # than skip both and leave a tagged commit with no release.
      - name: What already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            # An existing tag is only acceptable if it names *this* commit — a
            # rerun.
            tagged="$(git rev-list -n 1 "refs/tags/$version")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$version already exists and points at $tagged, not $GITHUB_SHA."
              echo "::error::Refusing to publish a release whose tag names a different commit."
              exit 1
            fi
            echo "tag=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag $version already points at this commit — rerun."
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $version already published."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the merge commit
        if: steps.exists.outputs.tag == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated, so the tag records who cut the release and when.
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "${{ steps.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Publish the release notes
        if: steps.exists.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
