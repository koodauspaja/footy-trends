# Why each setting is as it is: decisions/522-railway-environment-from-code.md
# A new Railway environment, from nothing to a site that answers: its own
# Postgres and Redis, the web service, and its keys from this job's secrets.
# Started by hand, and approved by a reviewer of the `railway-provisioning`
# environment before the job can read a secret.
name: Railway environment

on:
  workflow_dispatch:
    inputs:
      name:
        description: "The environment to create. It must not exist, or must hold nothing"
        required: true
        type: string
      branch:
        description: "The branch its site deploys from (ignored for staging and production, which have their own)"
        required: true
        default: main
        type: string

# The token every job gets unless it asks for more.
permissions:
  contents: read

# One at a time: two runs creating environments at once would read each other's
# half-built state.
concurrency:
  group: railway-environment
  cancel-in-progress: false

jobs:
  create:
    name: Create ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every secret below belongs to this environment, not to the repository:
    # the Railway token reaches the whole workspace, so a run waits here for a
    # required reviewer, and a workflow on another branch cannot read it
    # unasked.
    environment: railway-provisioning
    env:
      RAILWAY_CLI_VERSION: 5.62.1

    steps:
      # The default branch's scripts and config files, whatever branch the new
      # site deploys from: that branch is only a name handed to Railway.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        # `--ignore-scripts` blocks dependency lifecycle scripts, which are how
        # a compromised package runs code on a runner holding our tokens
        # (githubactions:S6505).
        run: npm ci --ignore-scripts

      - name: Install the Railway CLI
        # The release binary, at a pinned version, where the script looks for
        # it. Not the npm package: that one fetches its binary in a lifecycle
        # script.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin railway
          railway --version

      - name: Link the project
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        # A link needs an environment that exists, and every project has one:
        # the first listed. The script links the new one itself before it
        # applies anything.
        run: |
          set -euo pipefail
          first=$(railway environment list --json | jq -r '.environments[0].name')
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$first" --json > /dev/null

      - name: Create the environment
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          # Inputs arrive as variables, never spliced into the command line.
          ENVIRONMENT_NAME: ${{ inputs.name }}
          ENVIRONMENT_BRANCH: ${{ inputs.branch }}
          # Required: the site does not build without them.
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_ALLOWED_EMAILS: ${{ secrets.AUTH_ALLOWED_EMAILS }}
          # Optional, and shared with staging and production. Axiom's token and
          # dataset and Sentry's DSN are each environment's own, made by hand
          # in their consoles and set in Railway afterwards (docs/setup/026).
          TASO_API_KEY: ${{ secrets.TASO_API_KEY }}
        run: npm run railway:environment -- "--name=$ENVIRONMENT_NAME" "--branch=$ENVIRONMENT_BRANCH"
