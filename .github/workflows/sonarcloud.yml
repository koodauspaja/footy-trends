# Why each setting is as it is: decisions/531-configuration-files.md
name: SonarCloud analysis

on:
  push:
    branches:
      - main
  # Scoped to main deliberately. Without a branch filter this also runs on pull
  # requests targeting `release`, re-checking commits already reviewed on their
  # way into main. release.yml covers those, and adds e2e.
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# The token every job gets unless it asks for more.
permissions:
  contents: read

# A pull request's newer run supersedes its older one. A push to `main` gets a
# group of its own per commit, so it is never cancelled and never evicted from a
# queue: the same shape, for the same reason, as release.yml.
concurrency:
  group: sonarcloud-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # SonarQube Cloud reads the pull request to decorate it.
      pull-requests: read
    if: |
      github.actor == vars.OWNER_USERNAME ||
      github.actor == vars.COLLABORATOR_USERNAME ||
      github.actor == 'renovate[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for SonarCloud blame data

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install dependencies
        # `--ignore-scripts` blocks dependency lifecycle scripts, which are how
        # a compromised package runs code on a runner holding our tokens
        # (githubactions:S6505).
        run: npm ci --ignore-scripts

      - name: Run unit tests with coverage
        run: npm run test:unit

      # The newest release tag is the new-code boundary. By version, not
      # `git describe`: a release tag sits on `release`'s merge commit, which
      # nothing on `main` can reach.
      - name: Read the last release tag
        id: version
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "value=${tag:-0.0.0}" >> "$GITHUB_OUTPUT"

      # `skipNodeProvisioning` stops the scanner downloading its own Node for
      # the JS/TS analyzer.
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
            -Dsonar.scanner.skipNodeProvisioning=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
